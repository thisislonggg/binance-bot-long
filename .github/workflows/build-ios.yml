name: Build iOS IPA (Cloud Mac)

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-14
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Build Web App
        run: npm run build

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Compile Xcode Project (.xcodeproj)
        run: |
          cd ios/App
          xcodebuild clean build \
            -project App.xcodeproj \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE_SPECIFIER=""

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          APP_PATH=$(find ios/App/build -name "*.app" -type d | head -n 1)
          echo "Found app at: $APP_PATH"
          cp -r "$APP_PATH" Payload/
          zip -r RadarP2P-Binance.ipa Payload
          mkdir -p output
          mv RadarP2P-Binance.ipa output/

      - name: Upload .ipa as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radar-P2P-Binance-iOS
          path: output/RadarP2P-Binance.ipa
