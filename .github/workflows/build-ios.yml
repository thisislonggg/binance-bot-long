name: Build iOS IPA (Cloud Mac)

on:
  workflow_dispatch: # Memungkinkan build manual dari tab Actions di GitHub
  push:
    branches:
      - main

jobs:
  build-ipa:
    runs-on: macos-14 # Menggunakan server macOS resmi dari GitHub secara gratis
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"

      - name: Install Dependencies
        run: npm install

      - name: Sync Capacitor iOS
        run: npx cap sync ios

      - name: Compile Xcode Project (No Signing)
        run: |
          cd ios/App
          xcodebuild clean build \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package into .ipa
        run: |
          mkdir -p Payload
          cp -r ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r RadarP2P-Binance.ipa Payload
          mkdir -p output
          mv RadarP2P-Binance.ipa output/

      - name: Upload .ipa as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Radar-P2P-Binance-iOS
          path: output/RadarP2P-Binance.ipa
